# Render Blueprint for the Postmark backend (Express + MongoDB)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: postmark-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) after first deploy:
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
