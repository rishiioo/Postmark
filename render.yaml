# Render Blueprint for the Postmark backend (Express + MongoDB)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: postmark-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) after the first deploy:
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL # your Vercel URL, e.g. https://postmark.vercel.app
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-flash-latest
